name: refresh-data

on:
  schedule:
    - cron: "0 11,23 * * *" # 07:00 + 19:00 Beijing time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: fetch live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-data.mjs --limit 120
      - name: sanity check data
        run: |
          node -e "const d=require('./public/data/repos.json');if(!d.meta||d.meta.repoCount<1){console.error('repos.json looks empty — refusing to commit');process.exit(1)}"

      - name: commit data
        run: |
          git config user.name "vibeboard-bot"
          git config user.email "vibeboard-bot@users.noreply.github.com"
          git add public/data/repos.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh repos.json"
            git push
          fi
